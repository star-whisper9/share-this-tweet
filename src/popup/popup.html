<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="common.brand">分享有据 · Share This Tweet</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-card">
      <header class="popup-header">
        <img src="../icons/icon-48.png" alt="" />
        <div>
          <h1 data-i18n="common.brand">分享有据 · Share This Tweet</h1>
          <p data-i18n="popup.subtitle">X 分享增强</p>
        </div>
      </header>

      <section class="popup-status">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong data-i18n="popup.enabled">分享增强已启用</strong>
          <span data-i18n="popup.hint">打开 X 推文详情页即可使用</span>
        </div>
      </section>

      <div class="language-control">
        <label for="popup-language" data-i18n="common.language">界面语言</label>
        <select id="popup-language" data-language disabled>
          <option value="auto" data-i18n="common.language.auto">跟随浏览器</option>
          <option value="zh-CN" lang="zh-CN">简体中文</option>
          <option value="en" lang="en">English</option>
        </select>
      </div>
      <section
        class="template-summary"
        aria-label="当前模板"
        data-i18n-aria-label="popup.templates"
      >
        <div>
          <span data-i18n="popup.frame">来源画框</span>
          <code data-template="frame" data-i18n="common.loading">读取中…</code>
        </div>
        <div>
          <span data-i18n="popup.orientation">默认方向</span>
          <code data-template="orientation" data-i18n="common.loading">读取中…</code>
        </div>
        <div>
          <span data-i18n="popup.filename">文件命名</span>
          <code data-template="filename" data-i18n="common.loading">读取中…</code>
        </div>
        <div>
          <span data-i18n="popup.text">复制文字</span>
          <code data-template="text" data-i18n="common.loading">读取中…</code>
        </div>
      </section>

      <button class="tasks-button" type="button" data-open-tasks>
        <span data-i18n="jobs.viewTasks">查看导出任务</span>
        <span aria-hidden="true">↗</span>
      </button>
      <button class="settings-button" type="button" data-open-settings>
        <span data-i18n="popup.settings">打开设置</span>
        <span aria-hidden="true">↗</span>
      </button>
      <p class="popup-error" data-error hidden></p>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
